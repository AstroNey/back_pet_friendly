spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: petfriendly-backend
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Borne la taille des uploads (avatars/photos, import JSON) → évite un DoS mémoire.
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

petfriendly:
  jwt:
    secret: ${JWT_SECRET:petfriendly-dev-secret-key-must-be-at-least-254-bits-long-change-in-prod}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}
  cors:
    # Liste d'origines séparées par des virgules. Dev = "*". Prod = origine(s) du front (ex: https://admin.petfriendly.fr).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  rate-limit:
    auth:
      # Anti-brute-force sur /api/v1/auth/*. 0 = désactivé (dev). Fenêtre fixe par IP.
      max-requests: ${AUTH_RATE_LIMIT:10}
      window-seconds: ${AUTH_RATE_WINDOW:60}
  storage:
    type: ${STORAGE_TYPE:s3}
    bucket: ${S3_BUCKET:petfriendly-images}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio123}
    local:
      root-dir: ${LOCAL_STORAGE_DIR:./var/storage}
      public-base-url: ${LOCAL_STORAGE_PUBLIC_URL:http://localhost:8080/files}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${spring.profiles.active:dev}
  release: ${APP_VERSION:local}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.1}
  enable-tracing: true
  ignored-exceptions-for-type:
    - org.springframework.security.access.AccessDeniedException
    - lns.back.backend_pet_friendly.web.exception.ResourceNotFoundException
    - lns.back.backend_pet_friendly.domain.exception.ResourceNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info
