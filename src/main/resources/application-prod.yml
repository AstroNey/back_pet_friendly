spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true

petfriendly:
  jwt:
    # Aucune valeur par défaut en prod : démarrage impossible si JWT_SECRET est absent (pas de fallback dev public).
    secret: ${JWT_SECRET}

# La doc API expose toute la surface d'attaque : désactivée par défaut en prod (activable via env si besoin interne).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
