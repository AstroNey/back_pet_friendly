services:
  db:
    image: postgres:16-alpine
    container_name: petfriendly-db
    environment:
      POSTGRES_DB: petfriendlydb
      POSTGRES_USER: petfriendly
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petfriendly -d petfriendlydb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
